# cpplint settings for the CUDA C++ sources in src/ and tests/.
set noparent
linelength=80
# Header guards are derived from the path relative to the repository root,
# e.g. src/cuda/gpu_backend.h -> SRC_CUDA_GPU_BACKEND_H_.
root=.
# Project headers are included relative to src/ (the Makefile passes -Isrc),
# for example "cuda/gpu_backend.h" and "types.h". cpplint's rule that every
# project include must carry a directory prefix does not fit that layout. CUDA
# launch syntax (kernel<<<grid, block>>>) needs no filter with cpplint 2.0.2.
filter=-build/include_subdir
